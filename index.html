<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Entrar | Coroa Viva</title><style>:root{--blue:#1a73e8;--ink:#202124;--muted:#5f6368;--line:#dadce0}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:#fff;color:var(--ink);font:14px Arial,Helvetica,sans-serif;display:flex;flex-direction:column}.main{display:grid;place-items:center;flex:1;padding:24px}.card{width:min(100%,448px);padding:48px 40px 36px;border:1px solid var(--line);border-radius:8px;text-align:center}.logo{display:inline-grid;place-items:center;width:42px;height:42px;margin-bottom:17px;border-radius:12px;background:linear-gradient(135deg,#1a73e8,#34a853);color:white;font-size:24px;font-weight:bold}.brand{margin:0;font-size:24px;font-weight:500;letter-spacing:-.3px}.subtitle{margin:9px 0 32px;font-size:16px}.field{position:relative;margin:0 0 8px;text-align:left}.field input{width:100%;height:56px;padding:18px 13px 6px;border:1px solid #747775;border-radius:4px;color:var(--ink);font-size:16px;outline:none}.field label{position:absolute;left:11px;top:18px;padding:0 3px;background:#fff;color:#5f6368;pointer-events:none;transition:.15s}.field input:focus{border:2px solid var(--blue);padding-left:12px}.field input:focus+label,.field input:not(:placeholder-shown)+label{top:-8px;color:var(--blue);font-size:12px}.field input:not(:placeholder-shown)+label{color:#5f6368}.assist{display:block;margin:0 0 31px;color:var(--blue);text-decoration:none;text-align:left;font-weight:600}.note{text-align:left;color:var(--muted);font-size:14px;line-height:1.45}.note a{color:var(--blue);font-weight:600;text-decoration:none}.actions{display:flex;align-items:center;justify-content:space-between;margin-top:32px}.create{border:0;background:none;color:var(--blue);font-weight:600;padding:10px 0}.next{border:0;border-radius:4px;padding:10px 24px;background:var(--blue);color:#fff;font-weight:600;box-shadow:0 1px 2px #0002}.next:hover{background:#185abc}.feedback{min-height:20px;margin-top:18px;color:#d93025;text-align:left;font-size:12px}.foot{display:flex;justify-content:space-between;align-items:center;width:min(100% - 48px,448px);margin:0 auto;padding:22px 0;color:#3c4043;font-size:12px}.foot select{border:0;background:#fff;color:#3c4043;padding:5px}@media(max-width:600px){.main{padding:0;place-items:start}.card{width:100%;padding:40px 24px;border:0;border-radius:0}.foot{width:calc(100% - 48px)}.subtitle{margin-bottom:30px}}</style></head><body><main class="main"><section class="card" aria-labelledby="title"><div class="logo">C</div><h1 class="brand" id="title">Coroa Viva</h1><p class="subtitle">Use sua conta para entrar</p><form id="login" novalidate><div class="field"><input id="email" type="email" autocomplete="email" placeholder=" " aria-label="E-mail ou telefone"><label for="email">E-mail ou telefone</label></div><a class="assist" href="#ajuda">Esqueceu seu e-mail?</a><p class="note">Não é seu computador? Use o modo visitante para fazer login de forma privada. <a href="#saiba">Saiba mais</a></p><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="create" type="button">Criar conta</button><button class="next" type="submit">Próxima</button></div></form></section></main><footer class="foot"><select aria-label="Idioma"><option>Português (Brasil)</option></select><span>Ajuda&nbsp;&nbsp; Privacidade&nbsp;&nbsp; Termos</span></footer><script>document.getElementById("login").onsubmit=e=>{e.preventDefault();const email=document.getElementById("email").value.trim(),out=document.getElementById("feedback");out.textContent=email?"Este é apenas um layout de login. A autenticação ainda não foi conectada.":"Digite um e-mail ou telefone para continuar."}</script></body></html>
