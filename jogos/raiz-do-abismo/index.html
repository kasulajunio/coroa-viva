<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Raiz do Abismo</title><style>*{box-sizing:border-box}body{margin:0;background:#12281d;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}button{font:inherit;border:1px solid #a6bb9466;border-radius:15px;background:#345740ed;color:#f9edd0;padding:13px;touch-action:none;cursor:pointer}#hud{position:absolute;top:12px;left:14px;right:14px;color:#f9edd0;display:flex;align-items:center;gap:12px;font-size:12px;pointer-events:none;text-shadow:0 2px 5px #000}#hud button{pointer-events:auto}#panel{position:absolute;inset:0;display:grid;place-items:center;background:#12281daa;padding:20px;backdrop-filter:blur(5px)}#panel[hidden]{display:none}article{background:#faf0e5;color:#15251e;width:430px;max-width:100%;max-height:90dvh;overflow:auto;border-radius:24px;padding:25px;box-shadow:0 15px 80px #0005}h1{font:52px/.95 Georgia;letter-spacing:-2px;margin:18px 0}h2{font:28px Georgia}p{line-height:1.55;color:#415247}.eyebrow{font-size:10px;letter-spacing:.15em;color:#6a7852}article button{display:block;width:100%;margin-top:9px;background:#fff;color:#26392b;border:1px solid #d5d8ca}article button:first-of-type{background:#7850c4;color:#fff;border:0}small{font-size:11px;color:#6b746b}#controls[hidden]{display:none}#joy{position:absolute;bottom:25px;left:20px;width:110px;height:110px;border-radius:50%;border:1px solid #d7e8b955;background:#18332188;touch-action:none}#knob{position:absolute;left:34px;top:34px;width:42px;height:42px;border-radius:50%;background:#d7e8b944;border:1px solid #d7e8b966;pointer-events:none}.act{position:absolute;border-radius:50%;width:62px;height:62px;user-select:none;-webkit-user-select:none}.act small{display:block;font-size:9px;color:inherit}#attack{bottom:30px;right:18px;width:85px;height:85px;background:#a77d40ed;font-size:21px}#dash{bottom:18px;right:116px}#heal{bottom:93px;right:116px}#weapon{bottom:130px;right:18px;width:85px;height:44px;border-radius:13px;font-size:10px}#use{position:absolute;bottom:180px;left:50%;transform:translateX(-50%);display:none}#toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);width:max-content;max-width:88vw;text-align:center;background:#f4e8c8;color:#22392b;padding:10px 14px;border-radius:12px;display:none;pointer-events:none;font-size:12px}@media(max-height:500px){article{padding:17px}h1{font-size:36px;margin:8px 0}#joy{bottom:12px}#attack{bottom:15px}#dash{bottom:8px}#heal{bottom:82px}#weapon{bottom:115px}#use{bottom:120px}}</style><canvas id="c" aria-label="Aventura Raiz do Abismo"></canvas><div id="hud"><span id="stats">Uma última luz.</span><span style="flex:1"></span><button id="sound" aria-label="Som">♪</button><button id="pause" aria-label="Pausar">Ⅱ</button></div><div id="controls" hidden><div id="joy" aria-label="Movimentar"><div id="knob"></div></div><button class="act" id="attack" aria-label="Atacar">⚔<small>ATACAR</small></button><button class="act" id="dash">➜<small>ESQUIVA</small></button><button class="act" id="heal">✚<small id="pots">3</small></button><button class="act" id="weapon">ESPADA</button><button id="use">Abrir baú</button></div><div id="panel"><article id="menu"></article></div><div id="toast" role="status"></div><script src="engine.js"></script><script src="progress.js"></script><script src="scene.js"></script></html>
